# Reverse proxy de production — TLS, HTTP/2, WebSocket.
#
# Complète `nginx.conf`, qui reste la version de développement (HTTP nu, TLS
# terminé en amont). Les deux fichiers partagent la même logique de proxy ; ce
# qui s'ajoute ici est le chiffrement, la redirection et les en-têtes de
# sécurité.
#
# Le domaine est substitué au déploiement par `deploy.sh` (`envsubst`), à partir
# de `DOMAIN` dans `.env.prod`.

upstream api {
    server api:8000;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=1r/s;

# Cartographie de l'en-tête de mise à niveau : sans elle, une connexion
# WebSocket fermée laisse `Connection: upgrade` sur une requête HTTP ordinaire.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ─────────────────────────────────────────────────────── HTTP : ACME et renvoi
server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN};

    # Le défi ACME reste en clair : c'est ainsi que Let's Encrypt vérifie le
    # domaine, y compris pour délivrer le tout premier certificat — avant
    # lequel le bloc TLS ci-dessous ne peut pas démarrer.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ──────────────────────────────────────────────────────────────────── HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    # TLS 1.2 et 1.3 seulement. 1.0 et 1.1 sont retirés des navigateurs depuis
    # 2020 et leur maintien n'ouvre qu'un chemin de repli exploitable.
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # Agrafage OCSP : le navigateur n'a plus à interroger l'autorité, ce qui
    # évite une fuite de navigation et une latence au premier échange.
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            127.0.0.11 valid=300s;   # résolveur interne de Docker
    resolver_timeout    5s;

    # HSTS — un an, sous-domaines compris.
    #
    # À n'activer qu'une fois le certificat vérifié : un navigateur qui a vu cet
    # en-tête refusera toute connexion en clair au domaine pendant un an, y
    # compris si le certificat expire. C'est irréversible côté client.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "same-origin" always;

    client_max_body_size 10M;   # pièces d'identité livreurs, photos d'avis

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /health/ {
        proxy_pass http://api;
        access_log off;
    }

    # L'authentification est le point d'entrée à protéger en priorité : une
    # rafale de tentatives ne doit pas consommer de worker Python. Ce filtre ne
    # remplace pas celui de l'application (5/min par identifiant tenté, T1) —
    # il absorbe le volume grossier avant qu'il n'atteigne Django.
    location ~ ^/api/v1/auth/(login|register|password)/ {
        limit_req zone=api_auth burst=5 nodelay;
        proxy_pass http://api;
    }

    location /api/ {
        limit_req zone=api_general burst=60 nodelay;
        proxy_pass http://api;
    }

    location /ws/ {
        proxy_pass http://api;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Une connexion de suivi vit le temps d'une livraison. Le défaut de 60 s
        # la couperait toutes les minutes, et le client rejouerait sa reprise
        # par numéro de séquence en boucle (ADR-008).
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    # Les médias **ne sont pas servis ici**.
    #
    # Les pièces justificatives des livreurs sont dans un compartiment privé, et
    # se lisent par URL signées expirant en quinze minutes (MinIO). Les exposer
    # par Nginx annulerait la signature : l'adresse deviendrait permanente et
    # publique.
    location /media/ {
        return 404;
    }

    # Le back-office Flutter Web, si servi depuis le même domaine.
    location / {
        root /app/staticfiles/admin-web;
        try_files $uri $uri/ /index.html;
    }
}
