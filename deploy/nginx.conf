# Reverse proxy — HTTP et WebSocket vers le même service ASGI.
#
# La terminaison TLS est faite en amont (ingress Kubernetes ou ce même bloc
# complété par un certificat en déploiement autonome).

# Résolution du service `api` **à l'exécution**, et non une fois au démarrage.
#
# Ce fichier déclarait `upstream api { server api:8000; keepalive 32; }`. nginx
# résout alors le nom une seule fois, au chargement de la configuration, et
# garde l'adresse. Or `docker compose up -d` recrée le conteneur `api` avec une
# **nouvelle** adresse — sans toucher à nginx, qui n'a aucune raison d'être
# recréé. nginx continue donc d'appeler l'ancienne, et toute l'API répond 502
# jusqu'à ce que quelqu'un pense à redémarrer le proxy.
#
# Constaté le 2026-09-01 : `connect() failed (111: Connection refused) […]
# upstream: "http://172.18.0.7:8000/…"` pendant que le conteneur `api`
# parfaitement sain écoutait sur 172.18.0.6. Le symptôme — 502 sur tout —
# désigne l'application, alors que la panne est dans le proxy.
#
# `127.0.0.11` est le résolveur interne de Docker, présent dans tout conteneur
# rattaché à un réseau défini par l'utilisateur. `valid=10s` borne la mise en
# cache ; `ipv6=off` évite une tentative AAAA inutile sur un réseau qui n'en a
# pas.
#
# Ce que cela coûte : la directive `keepalive` de l'ancien bloc disparaît, car
# elle n'existe que sur un `upstream`. En développement, une connexion TCP par
# requête vers uvicorn ne se mesure pas — et un proxy juste vaut mieux qu'un
# proxy rapide qui pointe à côté. `deploy/nginx.prod.conf` garde son `upstream`
# et son `keepalive` : là-bas les conteneurs ne sont pas recréés sous le proxy
# entre deux commandes.
resolver 127.0.0.11 valid=10s ipv6=off;

# Limitation de premier niveau. Elle ne remplace pas celle de l'application
# (qui, elle, compte par utilisateur et par identifiant tenté — T1) : elle
# absorbe le volume grossier avant qu'il n'atteigne Python.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=1r/s;

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;   # pièces d'identité livreurs, photos d'avis

    # Le proxy ne doit pas mettre en cache d'entêtes d'authentification.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # `set` puis `$service` : sans variable dans `proxy_pass`, nginx résout au
    # chargement et le `resolver` ci-dessus ne sert à rien. `$request_uri` est
    # obligatoire dès lors que l'adresse est une variable — sans lui, le chemin
    # d'origine ne serait pas transmis.
    set $service api;

    location /health/ {
        proxy_pass http://$service:8000$request_uri;
        access_log off;
    }

    # L'authentification est le point d'entrée à protéger en priorité :
    # une rafale de tentatives ne doit pas consommer de worker Python.
    location ~ ^/api/v1/auth/(login|register|password)/ {
        limit_req zone=api_auth burst=5 nodelay;
        proxy_pass http://$service:8000$request_uri;
    }

    location /api/ {
        limit_req zone=api_general burst=60 nodelay;
        proxy_pass http://$service:8000$request_uri;
    }

    location /ws/ {
        proxy_pass http://$service:8000$request_uri;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Une connexion de suivi vit le temps d'une livraison. Le défaut de 60 s
        # la couperait toutes les minutes, et le client rejouerait sa reprise
        # par numéro de séquence en boucle (ADR-008).
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }
}
