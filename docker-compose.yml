# Environnement de développement de référence (ADR-001, Phase 8).
#
#   docker compose up
#
# Il porte PostGIS et Redis, que le poste Windows du projet n'a pas. C'est donc
# ici — et en CI — que la suite de tests complète s'exécute.
#
# Chaque service porte `restart: unless-stopped`, comme en production. Le motif
# est différent ici : ce n'est pas la disponibilité qu'on vise, c'est de ne pas
# perdre l'après-midi à chercher une panne réseau côté Flutter alors que Docker
# Desktop a simplement redémarré sous les pieds du poste. Les conteneurs
# repartent alors seuls ; un `docker compose stop` explicite, lui, est respecté.

name: elcorazon

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-elcorazon}
      POSTGRES_USER: ${POSTGRES_USER:-elcorazon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-elcorazon}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"   # 5433 : le poste a déjà un PostgreSQL 17 sur 5432
    healthcheck:
      # `-d` en plus de `-U` : sans nom de base, `pg_isready` interroge la base
      # portant le nom de l'utilisateur. Elle n'existe pas ici, et le serveur
      # répond quand même « accepting connections » — la sonde passe donc au
      # vert sur un serveur dont **notre** base serait absente ou en recovery.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-elcorazon} -d ${POSTGRES_DB:-elcorazon}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Le délai de grâce, et pourquoi il est long.
    #
    # À l'arrêt, l'image PostgreSQL reçoit SIGINT (`STOPSIGNAL` de l'image
    # amont) : c'est l'arrêt *rapide*, qui coupe les connexions puis écrit un
    # point de contrôle avant de rendre la main. Ce point de contrôle est ce
    # qui rend le prochain démarrage propre — sans lui, PostgreSQL rejoue son
    # WAL et resynchronise tout le répertoire de données.
    #
    # Docker n'accorde que **dix secondes** par défaut, puis SIGKILL. Or sur ce
    # poste, un point de contrôle ordinaire a déjà demandé plus de douze
    # secondes (journal du 2026-08-31 : 127 tampons, `total=12.451 s`) : le
    # disque de la machine virtuelle WSL2 est lent, et l'arrêt tombait dans la
    # fenêtre où le SIGKILL arrive avant la fin de l'écriture.
    #
    # Soixante secondes ne ralentissent aucun arrêt qui se passe bien : le
    # conteneur s'éteint dès que PostgreSQL a terminé.
    stop_grace_period: 60s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly no --save ""
    # Ni persistance ni sauvegarde : Redis ne porte que du cache, des files et
    # le channel layer. Rien dont la perte serait un incident métier.
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      target: dev
    # `exec uvicorn` et non `uvicorn` : sans lui, le shell reste PID 1 et
    # uvicorn tourne comme son enfant. `sh` ne relaie pas les signaux — le
    # SIGTERM d'un `docker compose stop` s'arrête donc sur le shell, uvicorn ne
    # l'apprend jamais, et le délai de grâce expire sur un SIGKILL qui emporte
    # tout le groupe.
    #
    # Ce n'est pas cosmétique : les connexions PostgreSQL sont alors rompues en
    # vol. Le journal du 2026-08-21 en porte la trace exacte —
    # `could not send data to client: Broken pipe`, puis `connection to client
    # lost`, puis `server process (PID 6483) exited with exit code 2`, et
    # PostgreSQL repart en récupération. `exec` fait d'uvicorn le PID 1 : il
    # reçoit le signal, ferme ses connexions, et le serveur ne voit qu'une
    # déconnexion ordinaire.
    #
    # `--reload` reste : c'est l'environnement de développement, et le
    # rechargement à chaud est ce pour quoi le code est monté en volume.
    #
    # `--reload-dir` en revanche est **nécessaire**, et son absence coûtait
    # cher. Sans lui, WatchFiles surveille tout `/app` — `tests/`, `docs/`,
    # `pyproject.toml`, les `.pyc`. Or un rechargement n'est pas gratuit ici :
    # le code est monté depuis Windows à travers la couche de partage de
    # Docker Desktop, et réimporter les vingt-cinq applications Django par ce
    # chemin prend **de 50 secondes à 6 minutes**. Le journal du conteneur en
    # garde deux exemples, tous deux déclenchés par un fichier de test :
    #
    #     12:13:54 detected changes in 'tests/accounts/test_verification.py'
    #     12:14:45 Started server process          → 51 s
    #     12:23:22 detected changes in 'tests/notifications/test_receivers.py'
    #     12:29:28 Started server process          → 6 min 06 s
    #
    # Et pendant tout ce temps le port **reste ouvert** : c'est le processus
    # superviseur d'uvicorn qui détient la socket d'écoute, pas l'ouvrier. Le
    # noyau accepte donc la connexion, la requête part, et rien ne répond
    # jamais. Un client ne voit pas « serveur éteint » — il voit un silence,
    # qu'il finit par abandonner sur son propre délai. C'est très exactement le
    # `connectionTimeout` de 15 s que l'application cliente rapportait au
    # démarrage, et la raison pour laquelle relancer l'écran suffisait à le
    # faire disparaître.
    #
    # Écrire un test ne doit pas fermer l'API pendant six minutes : la liste
    # ci-dessous est celle du code réellement servi.
    #
    # L'invocation d'uvicorn tient sur **une seule ligne**, et il faut qu'elle y
    # reste : dans un scalaire replié (`>`), une ligne plus indentée que les
    # autres conserve son retour à la ligne au lieu d'être repliée. Couper la
    # commande pour la lisibilité a exactement cet effet — le shell exécute
    # `exec uvicorn … --port 8000`, sans les options suivantes, puis n'atteint
    # jamais la ligne d'après puisque `exec` l'a remplacé. Le serveur démarre,
    # répond, et n'a simplement plus de rechargement à chaud : rien dans le
    # journal ne le dit, sinon l'absence de « Started reloader process ».
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py bootstrap_roles &&
             python manage.py ensure_storage_buckets &&
             exec uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload --reload-dir apps --reload-dir config --reload-dir common"
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app          # rechargement à chaud
      - ./secrets:/run/secrets:ro
    ports:
      - "8000:8000"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  worker:
    build:
      context: .
      target: dev
    command: celery -A config worker --loglevel=info --concurrency=2
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
      - ./secrets:/run/secrets:ro
    # L'image est commune aux trois rôles (voir Dockerfile) et porte un
    # `HEALTHCHECK` HTTP taillé pour l'API. Un worker ne sert aucun HTTP : sans
    # cette redéfinition, il est signalé `unhealthy` en permanence alors qu'il
    # consomme ses tâches normalement.
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  beat:
    build:
      context: .
      target: dev
    # `--schedule` sur un volume nommé, comme en production.
    #
    # Sans lui, l'échéancier s'écrit dans `/app`, c'est-à-dire — le code étant
    # monté en volume — **dans l'arbre des sources**, sur le disque Windows au
    # travers de la passerelle de fichiers de WSL2. Trois conséquences : un
    # `celerybeat-schedule-wal` de 2,6 Mo au milieu du dépôt, une écriture par
    # tour de boucle sur le montage le plus lent de la pile, et un échéancier
    # que `git clean` efface. Un volume nommé reste dans la machine virtuelle,
    # où l'écriture est locale, et survit aux recréations du conteneur.
    command: >
      celery -A config beat --loglevel=info
      --schedule /var/lib/celery/celerybeat-schedule
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
      - ./secrets:/run/secrets:ro
      - beatdata:/var/lib/celery
    # Même motif que le worker, mais `inspect ping` ne conviendrait pas :
    # l'ordonnanceur n'est pas un worker et ne répond pas au protocole de
    # contrôle. Ce qui prouve qu'il tourne, c'est qu'il **écrit** : il
    # sérialise son échéancier à chaque tour de boucle. Un fichier touché
    # récemment est donc un signe de vie, un fichier figé un beat coincé.
    #
    # Le glob est nécessaire : `shelve` s'appuie ici sur SQLite, et ce sont les
    # fichiers `-wal`/`-shm` qui bougent, pas le fichier de base.
    #
    # Dix minutes de fenêtre plutôt que cinq : `beat_max_loop_interval` vaut
    # 300 s par défaut, une fenêtre collée à cette valeur clignoterait sans
    # qu'il y ait de panne.
    healthcheck:
      test:
        - CMD-SHELL
        - find /var/lib/celery -maxdepth 1 -name 'celerybeat-schedule*' -newermt '-10 minutes' | grep -q .
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      redis: {condition: service_healthy}
    restart: unless-stopped

  # ⚠ TRANSITOIRE — le stockage objet est passé à Cloudinary (ADR-011), et plus
  # aucun service de ce fichier ne parle à MinIO. Il n'est conservé que pour
  # donner accès aux fichiers déposés avant la bascule, le temps de :
  #
  #     python manage.py migrate_media_to_cloudinary
  #
  # Une fois cette commande passée sans échec, supprimer ce bloc, le volume
  # `miniodata` en bas de fichier, et les ports 9000/9001. Garder le volume
  # jusque-là : c'est la seule copie de ces fichiers.
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      # Lues dans `.env`, et **sans valeur de repli**.
      #
      # Elles étaient écrites ici, à `minioadmin:minioadmin`, au motif que ce
      # service ne sert qu'à relire des fichiers déjà déposés. Deux choses le
      # démentent : ces fichiers sont les pièces d'identité des livreurs, et
      # les ports 9000/9001 sont publiés sur toutes les interfaces du poste —
      # pas seulement sur la boucle locale. MinIO le dit lui-même à chaque
      # démarrage : « Detected default credentials […] Please change them ».
      #
      # `:?` plutôt qu'une valeur par défaut : un identifiant absent doit
      # arrêter `docker compose up` en nommant la variable, pas retomber en
      # silence sur celui que tout le monde connaît. Voir `.env.example`.
      #
      # Changer ces identifiants ne touche pas aux données : MinIO les lit dans
      # son environnement, jamais dans le volume. Les fichiers déjà écrits
      # restent lisibles avec les nouveaux.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?identifiant MinIO manquant — voir .env.example}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?mot de passe MinIO manquant — voir .env.example}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # console d'administration
    healthcheck:
      # `depends_on: service_healthy` en dépend : sans lui, l'API démarre avant
      # que le serveur n'accepte les requêtes et la création des compartiments
      # échoue au premier démarrage — celui où personne ne regarde les journaux.
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  # Échéancier de beat. Nommé, et non écrit dans l'arbre des sources — voir le
  # service `beat`.
  beatdata:
