# Intégration continue du backend El Corazón — **dépôt `elcorazon-backend`**.
#
# ## Pourquoi ce fichier existe en double
#
# Le backend vit dans deux dépôts : `elcorazon`, qui porte tout le projet et sa
# CI, et `elcorazon-backend`, **celui que Render déploie**. Le second n'avait
# aucune CI : le code testé et le code déployé étaient deux choses distinctes,
# et rien ne les rapprochait.
#
# Ce n'était pas théorique. Au moment de l'audit, le correctif qui pose
# `PUSH_BACKEND` sur le vrai connecteur de notifications existait, testé et
# vert — dans un commit **non poussé**. Les trois branches distantes de ce
# dépôt-ci n'en portaient aucune trace, et la production envoyait donc ses
# notifications dans le vide, alors que le tableau de bord des tests était au
# vert.
#
# Fusionner les deux dépôts serait plus propre. Cela touche les historiques
# GitHub *et* la configuration Render, et se décide à vue : en attendant, ce
# dépôt devient **autonome**, et `render.yaml` ne déploie plus que sur un
# `checksPass` — c'est-à-dire sur un commit que ce fichier a validé.
#
# ## Ce qui le distingue de son jumeau
#
# Uniquement les chemins : ici le backend est à la racine, là-bas sous
# `projet/el-corazon/backend/`. Les étapes, les versions et les services sont
# identiques, et doivent le rester — une divergence entre les deux ferait
# passer en CI ce que l'autre refuse.

name: Backend CI

on:
  push:
  pull_request:

env:
  PYTHON_VERSION: "3.13"
  # Les installations échouaient par intermittence sur des `ReadTimeoutError`
  # de PyPI. Le défaut de pip — 5 tentatives, mais **15 secondes** de délai —
  # convient à une liaison courte ; un miroir lent ou une roue volumineuse le
  # dépasse sans qu'il y ait de panne réelle.
  PIP_RETRIES: "8"
  PIP_TIMEOUT: "60"

jobs:
  qualite:
    name: Qualité (ruff, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Bibliothèques géospatiales
        # Le greffon django-stubs de mypy appelle `django.setup()` pour
        # introspecter les modèles — y compris ceux d'`apps.geography`, qui
        # chargent GEOS/GDAL à l'import. Sans cette étape, mypy échoue à
        # l'import et non sur un vrai défaut de typage.
        run: sudo apt-get update && sudo apt-get install -y gdal-bin libgdal-dev libgeos-dev
      - run: pip install -e ".[dev]"
      - name: ruff — style et bogues probables
        run: ruff check .
      - name: ruff — format
        run: ruff format --check .
      - name: mypy — typage strict
        run: mypy common config apps

  tests:
    name: Tests (PostGIS + Redis)
    runs-on: ubuntu-latest

    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: elcorazon_test
          POSTGRES_USER: elcorazon
          POSTGRES_PASSWORD: elcorazon
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U elcorazon"
          --health-interval 5s --health-timeout 3s --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      GIS_ENABLED: "True"
      POSTGRES_DB: elcorazon_test
      POSTGRES_USER: elcorazon
      POSTGRES_PASSWORD: elcorazon
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Bibliothèques géospatiales
        # GDAL et GEOS sont des bibliothèques système, pas des paquets Python :
        # c'est le seul maillon que le poste de développement ne peut pas fournir.
        run: sudo apt-get update && sudo apt-get install -y gdal-bin libgdal-dev libgeos-dev

      - run: pip install -e ".[dev]"

      - name: Migrations — cohérence du schéma
        # Détecte une modification de modèle sans migration correspondante.
        # Sans ce garde-fou, la divergence n'apparaît qu'au déploiement — et
        # `deploy/start-api.sh` lance `migrate` au démarrage, donc sur la base
        # de production.
        run: python manage.py makemigrations --check --dry-run

      - name: Suite complète
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: couverture
          path: coverage.xml

  contrat:
    name: Contrat d'API
    runs-on: ubuntu-latest
    needs: qualite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y gdal-bin libgdal-dev libgeos-dev
      - run: pip install -e ".[dev]"
      - name: Génération du schéma OpenAPI
        # Le schéma est un artefact de revue (ADR-009) : toute rupture de
        # contrat devient visible dans la pull request, avant livraison.
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DJANGO_SECRET_KEY: ci-only-not-a-secret
          GIS_ENABLED: "False"
        run: python manage.py spectacular --file openapi.yaml --fail-on-warn
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi.yaml

  image:
    name: Construction de l'image
    runs-on: ubuntu-latest
    needs: [qualite, tests]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
