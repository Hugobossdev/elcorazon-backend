# Blueprint Render — El Corazón, API seule.
#
# Périmètre : le service web, PostgreSQL et Key Value, tous en offre gratuite.
# Celery n'y figure pas : Render ne propose aucune instance gratuite pour les
# `worker`, et les six tâches planifiées de `config/celery.py` ne tournent donc
# pas. Purge des positions, expiration des points, renouvellement des
# abonnements et fermeture des paniers de groupe restent à l'arrêt — c'est un
# déploiement de démonstration, pas une exploitation. Les brancher est un ajout
# de deux blocs `type: worker` en offre payante, sans autre changement.
#
# Ce que l'offre gratuite implique, et qu'il vaut mieux savoir avant :
#   — le service web s'endort après quinze minutes sans requête, et la requête
#     suivante attend son réveil, une trentaine de secondes ;
#   — la base gratuite est supprimée au bout d'un mois ;
#   — Key Value gratuit ne persiste rien : son contenu disparaît à chaque
#     redémarrage. Sans Celery, il ne porte que le cache et la couche de
#     canaux, que cette volatilité n'endommage pas.

services:
  - type: web
    name: elcorazon-backend
    runtime: docker
    plan: free
    # Francfort est la région la plus proche de l'Afrique de l'Ouest : environ
    # 90 ms depuis Lomé, contre 140 ms par la Virginie et davantage par l'Oregon.
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Sonde de vivacité sans accès base (`config/urls.py`), déjà exemptée de la
    # redirection HTTPS par `SECURE_REDIRECT_EXEMPT` dans `prod.py` : Render
    # l'interroge en clair sur l'adresse interne, et un 301 compterait comme un
    # échec — le déploiement serait annulé alors que l'application va bien.
    healthCheckPath: /health/
    autoDeployTrigger: commit

    # Aucun `dockerCommand` : la séquence de démarrage — migrations, fichiers
    # statiques, compte d'exploitation, données de démonstration, puis uvicorn —
    # est le `CMD` de l'image, dans `deploy/start-api.sh`.
    #
    # Elle y a été déplacée après une panne : `dockerCommand` n'est appliqué
    # qu'aux services **créés par ce blueprint**. Un service créé à la main
    # depuis le tableau de bord exécute le `CMD` de l'image et ignore ce
    # fichier ; les migrations ne passaient donc jamais, et le service tournait
    # sur une base vide en répondant 200 à `/health/` — qui n'accède pas à la
    # base — et 500 à tout le reste.
    #
    # Le blueprint ne redit donc pas ce que l'image sait déjà faire : une
    # commande écrite à deux endroits finit par diverger, et c'est la copie
    # oubliée qui s'exécute.

    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod

      # `generateValue` engendre 256 bits aléatoires à la création et les
      # conserve : la clé n'existe nulle part ailleurs, surtout pas dans ce dépôt.
      - key: DJANGO_SECRET_KEY
        generateValue: true

      # Le nom d'hôte attribué par Render (`elcorazon-api.onrender.com`). À
      # compléter à la main le jour où un domaine propre est branché : la
      # variable accepte une liste séparée par des virgules.
      - key: DJANGO_ALLOWED_HOSTS
        fromService:
          name: elcorazon-backend
          type: web
          property: host

      # ------------------------------------------------------- base de données
      #
      # Render ne publie sa base que sous forme d'URL unique. `base.py` sait la
      # décomposer et lui donne la priorité sur les variables `POSTGRES_*`.
      - key: DATABASE_URL
        fromDatabase:
          name: elcorazon-db
          property: connectionString

      # Redondant avec l'URL ci-dessus pour se connecter, mais pas pour démarrer :
      # le garde-fou de `prod.py` exige `POSTGRES_PASSWORD` non vide et lève une
      # `RuntimeError` sinon. Sans cette ligne, l'application refuse de charger
      # alors que sa base est parfaitement joignable.
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: elcorazon-db
          property: password

      - key: POSTGRES_CONN_MAX_AGE
        value: "60"

      - key: GIS_ENABLED
        value: "True"

      # ------------------------------------------------------- cache et canaux
      - key: REDIS_URL
        fromService:
          name: elcorazon-keyvalue
          type: keyvalue
          property: connectionString

      # ------------------------------------------------------- réseau
      #
      # Un proxy entre le client et l'application : celui de Render. **Réglage
      # de sécurité** — sans lui, DRF prend la chaîne `X-Forwarded-For` entière
      # pour identité, qu'un client forge à volonté, et la limitation par
      # adresse IP ne compte plus rien.
      - key: NUM_PROXIES
        value: "1"

      - key: LOG_LEVEL
        value: INFO

      # ------------------------------------------------------- compte d'exploitation
      #
      # Lues par `createsuperuser --noinput` (voir `dockerCommand`).
      # `DJANGO_SUPERUSER_FULL_NAME` et non `_USERNAME` : `User.USERNAME_FIELD`
      # vaut `email` et `REQUIRED_FIELDS` contient `full_name`, or la commande
      # dérive le nom de chaque variable du champ qu'elle renseigne.
      #
      # Ces trois variables peuvent être retirées du tableau de bord une fois le
      # compte créé et son mot de passe changé : le `|| true` absorbe alors
      # l'échec de la commande.
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_SUPERUSER_FULL_NAME
        sync: false

      # ------------------------------------------------------- données de démo
      #
      # Les migrations créent les tables, jamais leur contenu : sans cette
      # variable, le catalogue répond 200 sur une liste vide et l'application
      # affiche une carte blanche. `start-api.sh` pose alors l'établissement de
      # Lomé puis ses cinquante articles, sans photos.
      #
      # À retirer le jour où ce déploiement porte de vraies données : le seed
      # est idempotent et ne réécrit rien, mais garder la variable revient à
      # laisser une carte de démonstration se reposer à chaque redémarrage.
      - key: SEED_DEMO_DATA
        value: "true"

      # ------------------------------------------------------- JWT (ADR-004)
      #
      # Paire RSA au format PEM, sauts de ligne échappés en `\n` — `base.py` les
      # rétablit. `sync: false` : Render les demande à la création du blueprint
      # et ne les écrit jamais dans ce fichier.
      - key: JWT_SIGNING_KEY
        sync: false
      - key: JWT_VERIFYING_KEY
        sync: false

      # ------------------------------------------------------- stockage objet
      #
      # Cloudflare R2, compatible S3. Les quatre compartiments sont à créer à la
      # main dans la console : `ensure_storage_buckets` pose sa politique de
      # lecture avec `put_bucket_policy`, que R2 n'implémente pas — l'accès
      # public y passe par un domaine déclaré sur le compartiment. C'est
      # pourquoi cette commande, présente dans le démarrage du compose, est
      # absente du `dockerCommand` ci-dessus.
      - key: S3_ENDPOINT_URL
        sync: false
      # R2 n'a pas de régions au sens d'AWS et n'accepte que cette valeur.
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      # Vrai, contrairement au MinIO du compose : R2 est joint par l'Internet.
      - key: S3_USE_SSL
        value: "True"
      - key: S3_ADDRESSING_STYLE
        value: path
      # Adresse **publique** des compartiments publics — le domaine `r2.dev` du
      # compartiment ou un domaine propre. Sans elle, les applications reçoivent
      # des URL d'images pointant sur le point d'accès d'administration, qu'un
      # téléphone n'ouvrira pas.
      - key: S3_PUBLIC_URL
        sync: false
      - key: S3_BUCKET_PRODUCTS
        value: elcorazon-products
      - key: S3_BUCKET_BANNERS
        value: elcorazon-banners
      - key: S3_BUCKET_USERS
        value: elcorazon-users
      - key: S3_BUCKET_DOCUMENTS
        value: elcorazon-documents
      - key: S3_SIGNED_URL_EXPIRE
        value: "900"

      # ------------------------------------------------------- messagerie
      #
      # `prod.py` lit ces quatre variables sans valeur de repli : leur absence
      # empêche le chargement des réglages, donc le démarrage.
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false

      # ------------------------------------------------------- métier
      - key: DEFAULT_CURRENCY
        value: XOF
      - key: COURIER_FEE_SHARE_PERCENT
        value: "80"

      # ------------------------------------------------- origines autorisées
      #
      # Vides tant que le back-office Flutter Web n'est pas déployé. Vide ne
      # veut pas dire ouvert : `CORS_ALLOW_ALL_ORIGINS` est faux en production,
      # donc aucun appel navigateur d'une autre origine ne passe. À renseigner
      # depuis le tableau de bord, avec le schéma (`https://admin.exemple.app`).
      - key: CORS_ALLOWED_ORIGINS
        value: ""
      - key: CSRF_TRUSTED_ORIGINS
        value: ""

  # Key Value — l'ex-Redis de Render. Porte le cache Django et la couche de
  # canaux de Channels. Déclaré dans `services` et non dans `databases` : cette
  # dernière clé est réservée à PostgreSQL.
  - type: keyvalue
    name: elcorazon-keyvalue
    plan: free
    region: frankfurt
    # `allkeys-lru` et non `noeviction` : l'offre gratuite plafonne à 25 Mio, et
    # une instance pleine en `noeviction` refuse toute écriture — le cache
    # renverrait des erreurs au lieu de simplement manquer sa cible. Réglage à
    # revoir le jour où Celery arrive : une file de tâches ne doit pas être
    # évincée, sous peine de perdre des tâches déjà acceptées.
    maxmemoryPolicy: allkeys-lru
    # Liste vide : seuls les services de ce compte Render joignent l'instance,
    # par le réseau privé. Aucune adresse publique.
    ipAllowList: []

databases:
  - name: elcorazon-db
    plan: free
    region: frankfurt
    databaseName: elcorazon
    user: elcorazon
    postgresMajorVersion: "17"
    # PostGIS est activé par la migration `geography/0000_postgis`, et non par un
    # `CREATE EXTENSION` lancé à la main : la base gratuite expire au bout d'un
    # mois et devra être recréée. Une étape manuelle se saute — celle-là se
    # serait sautée le jour où plus personne ne se souvient qu'elle existe.
    ipAllowList: []
