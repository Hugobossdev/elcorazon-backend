# Reverse proxy — HTTP et WebSocket vers le même service ASGI.
#
# La terminaison TLS est faite en amont (ingress Kubernetes ou ce même bloc
# complété par un certificat en déploiement autonome).

upstream api {
    server api:8000;
    keepalive 32;
}

# Limitation de premier niveau. Elle ne remplace pas celle de l'application
# (qui, elle, compte par utilisateur et par identifiant tenté — T1) : elle
# absorbe le volume grossier avant qu'il n'atteigne Python.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=1r/s;

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;   # pièces d'identité livreurs, photos d'avis

    # Le proxy ne doit pas mettre en cache d'entêtes d'authentification.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /health/ {
        proxy_pass http://api;
        access_log off;
    }

    # L'authentification est le point d'entrée à protéger en priorité :
    # une rafale de tentatives ne doit pas consommer de worker Python.
    location ~ ^/api/v1/auth/(login|register|password)/ {
        limit_req zone=api_auth burst=5 nodelay;
        proxy_pass http://api;
    }

    location /api/ {
        limit_req zone=api_general burst=60 nodelay;
        proxy_pass http://api;
    }

    location /ws/ {
        proxy_pass http://api;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Une connexion de suivi vit le temps d'une livraison. Le défaut de 60 s
        # la couperait toutes les minutes, et le client rejouerait sa reprise
        # par numéro de séquence en boucle (ADR-008).
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }
}
