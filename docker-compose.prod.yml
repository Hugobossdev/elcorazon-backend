# Déploiement de production.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Trois différences de fond avec `docker-compose.yml`, qui est un environnement
# de développement et le restera :
#
# * **rien n'est exposé sur l'hôte** sauf 80 et 443. La base, Redis et MinIO ne
#   sont joignables que depuis le réseau interne du compose ; les publier
#   revenait, en développement, à les ouvrir sur la machine — acceptable là,
#   pas ici ;
# * **aucune valeur par défaut de secret.** Chaque mot de passe est obligatoire
#   (`${VAR:?message}`) : le compose refuse de démarrer plutôt que de lancer une
#   base avec le mot de passe `elcorazon` ;
# * **le code n'est pas monté.** L'image `runtime` porte le code figé ; le
#   rechargement à chaud n'a pas sa place ici.

name: elcorazon-prod

x-django: &django
  image: elcorazon/api:${IMAGE_TAG:-latest}
  build:
    context: .
    target: runtime
  env_file: .env.prod
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.prod
    POSTGRES_HOST: db
    REDIS_URL: redis://redis:6379/0
  volumes:
    - ./secrets:/run/secrets:ro   # identifiants FCM, montés en lecture seule
    - media:/app/media
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}
  restart: unless-stopped
  logging: &journal
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?base manquante}
      POSTGRES_USER: ${POSTGRES_USER:?utilisateur manquant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?mot de passe obligatoire en production}
      # Sans cette variable, l'image accepte des connexions locales sans mot de
      # passe (`trust`).
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/backups:/backups        # cible de backup.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    logging: *journal

  redis:
    image: redis:7-alpine
    # Persistance activée, contrairement au développement : Redis porte ici la
    # file Celery. La perdre au redémarrage perdrait des notifications et des
    # tâches d'agrégation déjà acceptées.
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:?mot de passe Redis obligatoire}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *journal

  api:
    <<: *django
    # Gunicorn pour la gestion des processus, avec des workers Uvicorn pour
    # l'ASGI : l'application sert HTTP **et** WebSocket depuis le même point
    # d'entrée (Channels), ce qu'un worker WSGI ne saurait pas faire.
    #
    # `--timeout 60` plutôt que le défaut de 30 : un webhook de paiement peut
    # attendre un verrou de base sur une commande en cours d'écriture.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py ensure_storage_buckets &&
             gunicorn config.asgi:application
               --worker-class uvicorn.workers.UvicornWorker
               --workers ${GUNICORN_WORKERS:-4}
               --bind 0.0.0.0:8000
               --timeout 60
               --graceful-timeout 30
               --access-logfile -
               --error-logfile -"
    volumes:
      - ./secrets:/run/secrets:ro
      - media:/app/media
      - static:/app/staticfiles
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  worker:
    <<: *django
    command: celery -A config worker --loglevel=INFO --concurrency=${CELERY_CONCURRENCY:-4}
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s

  beat:
    <<: *django
    # L'ordonnanceur garde son échéancier dans un volume : sans lui, un
    # redémarrage rejouerait ou sauterait des tâches périodiques.
    command: >
      celery -A config beat --loglevel=INFO
      --schedule /var/lib/celery/celerybeat-schedule
    volumes:
      - ./secrets:/run/secrets:ro
      - beatdata:/var/lib/celery
    # Sans cette redéfinition, `beat` hérite du `HEALTHCHECK` HTTP gravé dans
    # l'image (Dockerfile), qui interroge `localhost:8000/health/` — un port que
    # l'ordonnanceur n'ouvre pas. Il était donc marqué `unhealthy` en
    # permanence, et avec `restart: unless-stopped` un orchestrateur qui agit
    # sur la santé redémarre en boucle un service qui va très bien. Constaté en
    # développement : 908 échecs d'affilée pendant que les tâches passaient.
    #
    # `inspect ping` (utilisé par le worker juste au-dessus) ne s'applique pas :
    # beat n'est pas un worker et ne répond pas au protocole de contrôle. Ce
    # qu'on observe à la place, c'est qu'il sérialise son échéancier à chaque
    # tour de boucle — le glob attrape les fichiers `-wal`/`-shm` de SQLite, qui
    # sont ceux qui bougent réellement.
    healthcheck:
      test:
        - CMD-SHELL
        - find /var/lib/celery -maxdepth 1 -name 'celerybeat-schedule*' -newermt '-10 minutes' | grep -q .
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      redis: {condition: service_healthy}

  # ⚠ TRANSITOIRE — le stockage objet est passé à Cloudinary (ADR-011), qui est
  # joint par l'Internet et n'a rien à faire tourner ici. Plus aucun service de
  # ce fichier ne parle à MinIO : il n'est conservé que pour donner accès aux
  # fichiers déposés avant la bascule, le temps de :
  #
  #     docker compose -f docker-compose.prod.yml exec api   #         python manage.py migrate_media_to_cloudinary
  #
  # Une fois cette commande passée sans échec, supprimer ce bloc et le volume
  # `miniodata` — après avoir vérifié qu'une sauvegarde en existe. Garder le
  # volume jusque-là : c'est la seule copie de ces fichiers.
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?mot de passe MinIO obligatoire}
      MINIO_BROWSER: "off"   # console fermée : ce service ne sert plus qu'à lire
    volumes:
      - miniodata:/data
    expose:
      - "9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    logging: *journal

  nginx:
    image: nginx:alpine
    volumes:
      - ./deploy/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - static:/app/staticfiles:ro
      - media:/app/media:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    logging: *journal
    # Recharge la configuration toutes les six heures : c'est ainsi que le
    # certificat renouvelé par certbot est pris en compte sans intervention.
    command: >
      sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done &
             nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot
    volumes:
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot
    # Tente un renouvellement toutes les douze heures. Let's Encrypt ne
    # renouvelle qu'à trente jours de l'échéance : les autres passages ne font
    # rien, et c'est la fréquence recommandée pour absorber une panne.
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot;
             sleep 12h & wait $${!}; done"
    restart: unless-stopped
    logging: *journal

volumes:
  pgdata:
  redisdata:
  miniodata:
  beatdata:
  static:
  media:
